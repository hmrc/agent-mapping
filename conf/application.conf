include "backend.conf"

play.modules.enabled += "uk.gov.hmrc.play.bootstrap.AuthModule"

play.modules.enabled += "uk.gov.hmrc.play.bootstrap.HttpClientV2Module"

play.modules.enabled += "uk.gov.hmrc.mongo.play.PlayMongoModule"

play.modules.enabled += "uk.gov.hmrc.agentmapping.module.ClockModule"

play.modules.enabled += "uk.gov.hmrc.agentmapping.module.CryptoProviderModule"

play.modules.enabled += "uk.gov.hmrc.agentmapping.module.DuplicateArnScanModule"

play.modules.enabled += "uk.gov.hmrc.agentmapping.module.MigrationsModule"

appName = "agent-mapping"
play.http.router = prod.Routes


# Metrics plugin settings - graphite reporting is configured on a per env basis
metrics {
    enabled = true
}


# Microservice specific config
auditing {
    enabled = true
}

mongodb {
    uri = "mongodb://localhost:27017/agent-mapping"
}

microservice {
    services {
        auth {
            host = localhost
            port = 8500
        }
        agent-services-account {
            host = localhost
            port = 9402
        }
        enrolment-store-proxy {
            host = localhost
            port = 7775
        }
    }
}

clientCount.maxRecords = 2000
clientCount.batchSize = 500

mandationDates {
  IR-SA-AGENT = 2026-01-01
  HMCE-VAT-AGNT = 2026-01-01
  HMRC-CHAR-AGENT = 2026-01-01
  HMRC-GTS-AGNT = 2026-01-01
  HMRC-MGD-AGNT = 2026-01-01
  HMRC-NOVRN-AGNT = 2026-01-01
  IR-CT-AGENT = 2026-01-01
  IR-PAYE-AGENT = 2026-01-01
  IR-SDLT-AGENT = 2026-01-01
}


mongo-async-driver {
    akka {
        log-dead-letters = 0
        log-dead-letters-during-shutdown = off
        loglevel = "WARNING"
    }
}

migrate-repositories = true

agent-termination {
  username = username
  password = password
}

termination.stride.enrolment = "caat"

fieldLevelEncryption {
  enable = true
  key = "GTfz3GZy0+gN0p/5wSqRBpWlbWVDMezXWtX+G9ENwCc="
  previousKeys = []
}

keyRotation {
  enabled = false
  maxTotalDuration = 1 hour
  batchSize = 1000
}

duplicateArnScan.run = true
